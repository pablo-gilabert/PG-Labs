# Automated quality checks for changes to the PG Labs portfolio.
name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only repository read access is necessary to validate the app.
permissions:
  contents: read

# Replace superseded runs on the same branch or pull request.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript · Oxlint · Vitest · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint source code
        run: npm run lint

      - name: Run unit and component tests
        run: npm run test:unit

      - name: Build production assets
        run: npm run build

      # Only Chromium is required by the current desktop/mobile projects.
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics when a check fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
